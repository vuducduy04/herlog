<div class="relative w-full max-w-md flex flex-col items-center">

<!-- Main Security Card Container -->

<!-- Hairline Status Accent Top Bar -->

<!-- Segmented 8-PIN Display -->

<p class="text-body-sm font-label-mono uppercase tracking-wider text-on-surface-variant/80 text-center mb-space-md select-none">enter PIN to continue</p><div class="flex items-center justify-between w-full gap-1.5 max-w-[340px] px-1" id="pin-display-container">
<!-- 8 Discrete PIN slots -->
<div class="pin-slot w-9 h-12 rounded-lg bg-surface-container flex items-center justify-center transition-all duration-150 shadow-sm" data-index="0">
<span class="pin-dot w-2 h-2 rounded-full bg-secondary/80 animate-pulse transition-all duration-150"></span>
</div>
<div class="pin-slot w-9 h-12 rounded-lg bg-surface-container flex items-center justify-center transition-all duration-150 shadow-sm" data-index="1">
<span class="pin-dot w-2.5 h-2.5 rounded-full bg-outline-variant transition-all duration-200"></span>
</div>
<div class="pin-slot w-9 h-12 rounded-lg bg-surface-container flex items-center justify-center transition-all duration-150 shadow-sm" data-index="2">
<span class="pin-dot w-2.5 h-2.5 rounded-full bg-outline-variant transition-all duration-200"></span>
</div>
<div class="pin-slot w-9 h-12 rounded-lg bg-surface-container flex items-center justify-center transition-all duration-150 shadow-sm" data-index="3">
<span class="pin-dot w-2.5 h-2.5 rounded-full bg-outline-variant transition-all duration-200"></span>
</div>
<div class="pin-slot w-9 h-12 rounded-lg bg-surface-container flex items-center justify-center transition-all duration-150 shadow-sm" data-index="4">
<span class="pin-dot w-2.5 h-2.5 rounded-full bg-outline-variant transition-all duration-200"></span>
</div>
<div class="pin-slot w-9 h-12 rounded-lg bg-surface-container flex items-center justify-center transition-all duration-150 shadow-sm" data-index="5">
<span class="pin-dot w-2.5 h-2.5 rounded-full bg-outline-variant transition-all duration-200"></span>
</div>
<div class="pin-slot w-9 h-12 rounded-lg bg-surface-container flex items-center justify-center transition-all duration-150 shadow-sm" data-index="6">
<span class="pin-dot w-2.5 h-2.5 rounded-full bg-outline-variant transition-all duration-200"></span>
</div>
<div class="pin-slot w-9 h-12 rounded-lg bg-surface-container flex items-center justify-center transition-all duration-150 shadow-sm" data-index="7">
<span class="pin-dot w-2.5 h-2.5 rounded-full bg-outline-variant transition-all duration-200"></span>
</div>
</div><div class="text-center mt-space-md select-none"><span class="text-body-sm text-outline font-body-sm">Forgot PIN? <a href="#" class="text-secondary hover:text-primary transition-colors underline-offset-4 hover:underline">Contact njoy.ur.life</a></span></div>
<!-- Dynamic Status/Feedback Message -->

</div>
<!-- High Precision Keypad Matrix -->

</div>

</div>
</div>
<script>
  (function() {
    const PIN_LENGTH = 8;
    let currentPin = "";
    const slots = document.querySelectorAll('.pin-slot');
    const feedbackEl = document.getElementById('status-feedback');
    const lockIcon = document.getElementById('lock-icon');

    function updatePinDisplay() {
      slots.forEach((slot, idx) => {
        const dot = slot.querySelector('.pin-dot');
        if (idx < currentPin.length) {
          // Entered digit state: emerald dot
          dot.className = 'pin-dot w-3 h-3 rounded-full bg-primary shadow-sm scale-110 transition-all duration-150';
          slot.classList.add('bg-surface-container-high');
        } else if (idx === currentPin.length) {
          // Active focused slot indicator
          dot.className = 'pin-dot w-2 h-2 rounded-full bg-secondary/80 animate-pulse transition-all duration-150';
          slot.classList.remove('bg-surface-container-high');
        } else {
          // Empty slot
          dot.className = 'pin-dot w-2.5 h-2.5 rounded-full bg-outline-variant transition-all duration-200';
          slot.classList.remove('bg-surface-container-high');
        }
      });
    }

    function addDigit(digit) {
      if (currentPin.length < PIN_LENGTH) {
        currentPin += digit;
        updatePinDisplay();
        resetFeedback();
        if (currentPin.length === PIN_LENGTH) {
          validatePin();
        }
      }
    }

    function clearDigits() {
      if (currentPin.length > 0) {
        currentPin = currentPin.slice(0, -1);
        updatePinDisplay();
        resetFeedback();
      }
    }

    function resetFeedback() {
      feedbackEl.innerHTML = `
        <span class="font-code-body text-code-body text-on-surface-variant flex items-center gap-1.5">
          <span class="material-symbols-outlined text-[14px] text-secondary">encrypted</span>
          ${currentPin.length} / ${PIN_LENGTH} digits verified locally
        </span>
      `;
    }

    function validatePin() {
      // Simulate cryptographic verification
      feedbackEl.innerHTML = `
        <span class="font-code-body text-code-body text-secondary flex items-center gap-1.5 animate-pulse">
          <span class="material-symbols-outlined text-[14px]">sync</span>
          Deriving vault master key...
        </span>
      `;

      setTimeout(() => {
        if (currentPin === "84920173" || currentPin.length === PIN_LENGTH) {
          // Successful authorization simulation
          feedbackEl.innerHTML = `
            <span class="font-code-body text-code-body text-primary flex items-center gap-1.5">
              <span class="material-symbols-outlined text-[14px]">verified</span>
              Decryption key validated. Unlocking...
            </span>
          `;
          lockIcon.textContent = 'lock_open';
          lockIcon.classList.add('text-primary');
          slots.forEach(slot => {
            const dot = slot.querySelector('.pin-dot');
            dot.classList.add('bg-primary-container');
          });
        }
      }, 400);
    }

    // Keypad number triggers
    document.querySelectorAll('.keypad-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.querySelector('span').innerText.trim();
        addDigit(val);
      });
    });

    document.getElementById('btn-clear').addEventListener('click', clearDigits);

    document.getElementById('btn-unlock-vault').addEventListener('click', () => {
      if (currentPin.length < PIN_LENGTH) {
        feedbackEl.innerHTML = `
          <span class="font-code-body text-code-body text-error flex items-center gap-1.5">
            <span class="material-symbols-outlined text-[14px]">error</span>
            Passkey requires full ${PIN_LENGTH} digits
          </span>
        `;
        // Subtle shake animation
        const container = document.getElementById('pin-display-container');
        container.classList.add('translate-x-1');
        setTimeout(() => container.classList.remove('translate-x-1'), 80);
      } else {
        validatePin();
      }
    });

    document.getElementById('btn-quick-unlock').addEventListener('click', () => {
      if (currentPin.length > 0) validatePin();
    });

    // Hardware and Biometric triggers
    document.getElementById('btn-biometric').addEventListener('click', () => {
      feedbackEl.innerHTML = `
        <span class="font-code-body text-code-body text-secondary flex items-center gap-1.5">
          <span class="material-symbols-outlined text-[14px] animate-spin">fingerprint</span>
          Scanning biometric enclave...
        </span>
      `;
      setTimeout(() => {
        currentPin = "84920173";
        updatePinDisplay();
        validatePin();
      }, 600);
    });

    document.getElementById('btn-hardware-key').addEventListener('click', () => {
      feedbackEl.innerHTML = `
        <span class="font-code-body text-code-body text-on-surface flex items-center gap-1.5">
          <span class="material-symbols-outlined text-[14px] text-secondary">usb</span>
          Touch security key now...
        </span>
      `;
    });

    // Physical Keyboard support
    window.addEventListener('keydown', (e) => {
      if (/^[0-9]$/.test(e.key)) {
        addDigit(e.key);
      } else if (e.key === 'Backspace') {
        clearDigits();
      } else if (e.key === 'Enter') {
        validatePin();
      }
    });

    // Session auto-wipe countdown timer simulation
    let secondsLeft = 14 * 60 + 59;
    const countdownEl = document.getElementById('countdown-timer');
    setInterval(() => {
      if (secondsLeft > 0) {
        secondsLeft--;
        const mins = Math.floor(secondsLeft / 60);
        const secs = secondsLeft % 60;
        countdownEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      }
    }, 1000);

    // Initial state setup
    updatePinDisplay();
  })();
</script></main>
